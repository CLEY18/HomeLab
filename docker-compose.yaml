services:
  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
      - ${POSTGRES_INIT_SQL_PATH}:/docker-entrypoint-initdb.d/init.sql
    ports: ["5432:5432"]
    networks: [workspace]

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      # All databases (space-separated): without this only ${POSTGRES_DB} is backed up
      POSTGRES_DB: ${POSTGRES_DB} ${NPM_DB} ${NEXTCLOUD_DB} ${VAULTWARDEN_DB} ${PAPERCLIP_DB} ${ANYTHINGLLM_DB} ${LIBRECHAT_RAG_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ${POSTGRES_BACKUP_PATH}:/backups
    networks: [workspace]

  # ─── MongoDB (shared) ──────────────────────────────────
  mongodb:
    image: mongo:8
    restart: unless-stopped
    healthcheck:
      test: ["CMD","mongosh","--quiet","--eval","db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - ${MONGO_DATA_PATH}:/data/db
    ports: ["27017:27017"]
    networks: [workspace]

  mongodb-backup:
    image: mongo:8
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${PASSWORD_URLENC}@mongodb:27017/${LIBRECHAT_DB}?authSource=admin
      LIBRECHAT_DB: ${LIBRECHAT_DB}
      BACKUP_INTERVAL: "86400"
      TZ: ${TZ:-Europe/Kyiv}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/$${LIBRECHAT_DB}-$$(date +%Y%m%d-%H%M%S).archive.gz
          mongodump --uri="$$MONGO_URI" --gzip --archive="$$f" && echo "backup: $$f"
          find /backups -name '*.archive.gz' -mtime +14 -delete
          sleep $${BACKUP_INTERVAL}
        done
    volumes:
      - ${MONGO_BACKUP_PATH}:/backups
    networks: [workspace]

  # ─── Redis ──────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [workspace]

  # ─── Nginx Proxy Manager ────────────────────────────────
  nginx-proxy-manager:
      image: jc21/nginx-proxy-manager:latest
      restart: unless-stopped
      depends_on:
        postgres:
          condition: service_healthy
      ports:
        - "80:80"
        - "443:443"
        - "81:81"
      environment:
        DB_POSTGRES_HOST: postgres
        DB_POSTGRES_PORT: 5432
        DB_POSTGRES_USER: ${POSTGRES_USER}
        DB_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        DB_POSTGRES_NAME: ${NPM_DB}
        INITIAL_ADMIN_EMAIL: ${NPM_INITIAL_ADMIN_EMAIL}
        INITIAL_ADMIN_PASSWORD: ${NPM_INITIAL_ADMIN_PASSWORD}
      volumes:
        - ${NPM_DATA_PATH}:/data
        - ${NPM_APP_PATH}/letsencrypt:/etc/letsencrypt
      networks: [workspace]

  # ─── Nextcloud ───────────────────────────────────────────────
  nextcloud:
    image: nextcloud:apache
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${NEXTCLOUD_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_HOST_PORT: 6379
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
    volumes:
      - ${NEXTCLOUD_APP_PATH}:/var/www/html
      - ${NEXTCLOUD_DATA_PATH}:/var/www/html/data
    ports: ["8082:80"]
    networks: [workspace]

  nextcloud-cron:
    image: nextcloud:apache
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: /cron.sh
    volumes:
      - ${NEXTCLOUD_APP_PATH}:/var/www/html
      - ${NEXTCLOUD_DATA_PATH}:/var/www/html/data
    networks: [workspace]

  # ─── Vaultwarden (Password Manager) ────────────────────
  vaultwarden:
    image: vaultwarden/server:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN}
      # container must listen on 8089 to match the 8089:8089 port mapping (default is 80)
      ROCKET_PORT: "8089"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${PASSWORD_URLENC}@postgres:5432/${VAULTWARDEN_DB}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      DATA_FOLDER: /config
      RSA_KEY_FILENAME: /config/rsa_key
      ICON_CACHE_FOLDER: /config/icon_cache
      ATTACHMENTS_FOLDER: /data/attachments
      SENDS_FOLDER: /data/sends
    volumes:
      - ${VAULTWARDEN_APP_PATH}:/config
      - ${VAULTWARDEN_DATA_PATH}/attachments:/data/attachments
      - ${VAULTWARDEN_DATA_PATH}/sends:/data/sends
    ports: ["8089:8089"]
    networks: [workspace]

  # ─── Kavita (Books/Manga/Comics Server) ────────────────
  kavita:
    image: jvmilazz0/kavita:latest
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - ${KAVITA_APP_PATH}:/kavita/config
      - ${KAVITA_BACKUP_PATH}:/kavita/backups
      - ${KAVITA_DATA_PATH}:/library
    ports: ["5000:5000"]
    networks: [workspace]

  # ─── Wealthfolio (Portfolio Tracker) ───────────────────
  wealthfolio:
    image: wealthfolio/wealthfolio:latest
    restart: unless-stopped
    environment:
      WF_LISTEN_ADDR: 0.0.0.0:8088
      WF_DB_PATH: /data/wealthfolio.db
      WF_SECRET_KEY: ${WF_SECRET_KEY}
      WF_AUTH_PASSWORD_HASH: ${WF_AUTH_PASSWORD_HASH}
      WF_CORS_ALLOW_ORIGINS: ${WF_CORS_ALLOW_ORIGINS}
      WF_MCP_ENABLED: "true"
    volumes:
      - ${WEALTHFOLIO_DATA_PATH}:/data
    ports: ["8088:8088"]
    networks: [workspace]

  # ─── AnythingLLM (AI Chat) ─────────────────────────────
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    restart: unless-stopped
    profiles: ["ai"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # must stay /app/server/storage: uploads are staged in $STORAGE_DIR/../../collector/hotdir,
      # any other path breaks document uploads (anything-llm issue #5152)
      STORAGE_DIR: /app/server/storage
      VECTOR_DB: pgvector
      PGVECTOR_CONNECTION_STRING: postgresql://${POSTGRES_USER}:${PASSWORD_URLENC}@postgres:5432/${ANYTHINGLLM_DB}
      JWT_SECRET: ${ANYTHINGLLM_JWT_SECRET}
      LLM_PROVIDER: localai
      LOCAL_AI_BASE_PATH: ${LLM_BASE_URL}
      LOCAL_AI_API_KEY: ${LLM_API_KEY}
      LOCAL_AI_MODEL_PREF: ${LLM_CHAT_MODEL}
      EMBEDDING_ENGINE: localai
      EMBEDDING_BASE_PATH: ${EMBEDDINGS_BASE_URL:-${LLM_BASE_URL}}
      EMBEDDING_MODEL_PREF: ${EMBEDDINGS_MODEL}
      DISABLE_TELEMETRY: "true"
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - ${ANYTHINGLLM_DATA_PATH}:/app/server/storage
    ports: ["8083:3001"]
    networks: [workspace]

  # ─── LibreChat (AI Chat) ───────────────────────────────
  librechat:
    image: registry.librechat.ai/librechat-ai/librechat:latest
    restart: unless-stopped
    profiles: ["ai"]
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      rag_api:
        condition: service_started
    environment:
      HOST: "0.0.0.0"
      PORT: "3080"
      MONGO_URI: mongodb://${MONGO_USER}:${PASSWORD_URLENC}@mongodb:27017/${LIBRECHAT_DB}?authSource=admin
      DOMAIN_CLIENT: ${LIBRECHAT_DOMAIN}
      DOMAIN_SERVER: ${LIBRECHAT_DOMAIN}
      # v0.8.8 treats unset as disabled; first registered user bootstraps ADMIN
      ALLOW_REGISTRATION: "true"
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY}
      CREDS_IV: ${LIBRECHAT_CREDS_IV}
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET}
      USE_REDIS: "true"
      REDIS_URI: redis://redis:6379
      # key prefix isolates LibreChat from nextcloud keys in the shared redis
      REDIS_KEY_PREFIX: librechat
      SEARCH: "true"
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
      RAG_API_URL: http://rag_api:8000
      RAG_OPENAI_BASEURL: ${EMBEDDINGS_BASE_URL:-${LLM_BASE_URL}}
      RAG_OPENAI_API_KEY: ${EMBEDDINGS_API_KEY:-${LLM_API_KEY}}
      EMBEDDINGS_PROVIDER: openai
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL}
      LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/data/.env.temp
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml
      - ${LIBRECHAT_APP_PATH}/logs:/app/logs
      - ${LIBRECHAT_APP_PATH}/data:/app/data
      - ${LIBRECHAT_DATA_PATH}/images:/app/client/public/images
      - ${LIBRECHAT_DATA_PATH}/uploads:/app/uploads
    ports: ["8084:3080"]
    networks: [workspace]

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: unless-stopped
    profiles: ["ai"]
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - ${LIBRECHAT_APP_PATH}/meilisearch:/meili_data
    networks: [workspace]

  rag_api:
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite:latest
    restart: unless-stopped
    profiles: ["ai"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_DB: ${LIBRECHAT_RAG_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RAG_HOST: "0.0.0.0"
      RAG_PORT: "8000"
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET}
      RAG_OPENAI_API_KEY: ${EMBEDDINGS_API_KEY:-${LLM_API_KEY}}
      RAG_OPENAI_BASEURL: ${EMBEDDINGS_BASE_URL:-${LLM_BASE_URL}}
      EMBEDDINGS_PROVIDER: openai
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL}
      TZ: ${TZ:-Europe/Kyiv}
    networks: [workspace]

  # ─── Paperclip (AI Agents Orchestration) ───────────────
  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    restart: unless-stopped
    profiles: ["ai"]
    depends_on:
      postgres:
        condition: service_healthy
    pids_limit: 2048
    stop_grace_period: 90s
    environment:
      HOST: "0.0.0.0"
      PAPERCLIP_HOME: /paperclip
      DATABASE_URL: postgresql://${POSTGRES_USER}:${PASSWORD_URLENC}@postgres:5432/${PAPERCLIP_DB}
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL}
      PAPERCLIP_ALLOWED_HOSTNAMES: ${PAPERCLIP_ALLOWED_HOSTNAMES}
      PAPERCLIP_TELEMETRY_DISABLED: "true"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET}
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - ${PAPERCLIP_DATA_PATH}:/paperclip
    ports: ["8085:3100"]
    networks: [workspace]

networks:
  workspace:
    driver: bridge
