# LibreChat config — kept in git; values only via ${VAR} from .env (no secrets here).
# Documentation: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.18
cache: true
endpoints:
  custom:
    - name: "Local LLM"
      apiKey: "${LLM_API_KEY}"
      baseURL: "${LLM_BASE_URL}"
      models:
        # placeholder: schema requires a non-empty fallback list; the live
        # list is fetched from the endpoint's /models and replaces this
        default: ["local-llm"]
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      dropParams: ["stop"]
      modelDisplayLabel: "Local LLM"
